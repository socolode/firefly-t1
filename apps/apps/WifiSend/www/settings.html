<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参数设置 - OpenStickT1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            text-decoration: none;
            font-size: 0.95em;
            padding: 10px 16px;
            background: white;
            color: #667eea;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }
        
        .header h1 {
            font-size: 1.5em;
            color: #1f2937;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .card-title {
            font-size: 1.1em;
            color: #374151;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .setting-item {
            margin-bottom: 20px;
        }
        
        .setting-item:last-child {
            margin-bottom: 0;
        }
        
        .setting-label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .setting-hint {
            display: block;
            font-size: 0.85em;
            color: #6b7280;
            margin-bottom: 12px;
        }
        
        .setting-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            background: white;
            cursor: pointer;
        }
        
        .setting-select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .led-count {
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-radius: 8px;
            text-align: center;
        }
        
        .led-count span {
            font-size: 2em;
            font-weight: bold;
            color: #16a34a;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 30px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 30px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        .toggle-switch input:checked + .toggle-slider {
            background-color: #16a34a;
        }
        
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .connection-status.connected {
            color: #16a34a;
        }
        
        .connection-status.disconnected {
            color: #dc2626;
        }
        
        .connection-status.connecting {
            color: #f59e0b;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .connection-status.connected .status-dot {
            background: #16a34a;
            box-shadow: 0 0 10px #16a34a;
        }
        
        .connection-status.disconnected .status-dot {
            background: #dc2626;
        }
        
        .connection-status.connecting .status-dot {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .btn-save {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-save:active {
            transform: translateY(0);
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .hint-box {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border-left: 4px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .hint-box .hint-title {
            font-weight: bold;
            color: #1e40af;
            margin-bottom: 8px;
            font-size: 1em;
        }
        
        .hint-box .hint-text {
            color: #1e3a8a;
            font-size: 0.9em;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn">⬅️ 返回</a>
    <div class="connection-status connecting" id="connectionStatus">
        <span class="status-dot"></span>
        <span>连接检测中...</span>
    </div>
    <div class="container">
        <div class="header">
            <h1>⚙️ 参数设置</h1>
        </div>
        
        <div class="card">
            <h2 class="card-title">💡 灯棒长度</h2>
            
            <div class="setting-item">
                <label class="setting-label">灯棒长度</label>
                <span class="setting-hint">一段对应48颗灯珠</span>
                <select class="setting-select" id="lightStickLength" onchange="updateLedCount()">
                    <option value="1">1 段</option>
                    <option value="2">2 段</option>
                    <option value="3" selected>3 段</option>
                    <option value="4">4 段</option>
                    <option value="5">5 段</option>
                    <option value="6">6 段</option>
                </select>
                
                <div class="led-count">
                    总灯珠数：<span id="ledCount">144</span> 颗
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2 class="card-title">⏰ 自动关机</h2>
            
            <div class="setting-item">
                <div class="toggle-row">
                    <label class="setting-label" style="margin-bottom: 0;">启用自动关机</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoShutdown" onchange="updateShutdownTimeVisibility()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
            
            <div class="setting-item" id="shutdownTimeItem">
                <label class="setting-label">自动关机时间</label>
                <select class="setting-select" id="autoShutdownSeconds">
                    <option value="60">1 分钟</option>
                    <option value="120">2 分钟</option>
                    <option value="180">3 分钟</option>
                    <option value="300" selected>5 分钟</option>
                    <option value="600">10 分钟</option>
                    <option value="900">15 分钟</option>
                </select>
            </div>
        </div>
        
        <div class="card">
            <h2 class="card-title">🎨 颜色设置</h2>
            
            <div class="setting-item">
                <div class="toggle-row">
                    <label class="setting-label" style="margin-bottom: 0;">红绿色切换</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="redGreenSwap" onchange="updateRedGreenHint()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="hint-box">
                    <div class="hint-title">💡 使用提示</div>
                    <div class="hint-text">
                        不同灯珠型号的红绿颜色可能相反！<br>
                        <strong>如果红色显示成绿色，绿色显示成红色，请开启此开关。</strong><br>
                        - 开启后：红色和绿色会互换显示<br>
                        - 关闭后：按正常颜色显示
                    </div>
                </div>
            </div>
        </div>
        
        <button class="btn-save" onclick="saveSettings()">
            💾 保存设置
        </button>
        
        <div class="footer">
            <p>OpenStickT1 参数设置</p>
        </div>
    </div>
    
    <script>
        function updateLedCount() {
            var select = document.getElementById('lightStickLength');
            var length = parseInt(select.value);
            var ledCount = length * 48;
            document.getElementById('ledCount').textContent = ledCount;
        }
        
        function updateShutdownTimeVisibility() {
            var checkbox = document.getElementById('autoShutdown');
            var timeItem = document.getElementById('shutdownTimeItem');
            timeItem.style.display = checkbox.checked ? 'block' : 'none';
        }
        
        function loadSettings() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/config.json', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    try {
                        var config = JSON.parse(xhr.responseText);
                        if (config.light_stick_length) {
                            document.getElementById('lightStickLength').value = config.light_stick_length;
                            updateLedCount();
                        }
                        if (config.auto_shutdown !== undefined) {
                            document.getElementById('autoShutdown').checked = config.auto_shutdown;
                            updateShutdownTimeVisibility();
                        }
                        if (config.auto_shutdown_seconds) {
                            document.getElementById('autoShutdownSeconds').value = config.auto_shutdown_seconds;
                        }
                        if (config.red_green_swap !== undefined) {
                            document.getElementById('redGreenSwap').checked = config.red_green_swap;
                        }
                    } catch (e) {
                        console.error('Failed to parse config:', e);
                    }
                }
            };
            xhr.send();
        }
        
        function saveSettings() {
            var length = document.getElementById('lightStickLength').value;
            var autoShutdown = document.getElementById('autoShutdown').checked;
            var autoShutdownSeconds = parseInt(document.getElementById('autoShutdownSeconds').value);
            var redGreenSwap = document.getElementById('redGreenSwap').checked;
            
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/save_config', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4) {
                    if (xhr.status == 200) {
                        var shutdownText = autoShutdown ? '已启用，' + (autoShutdownSeconds / 60) + '分钟后关机' : '已禁用';
                        var colorText = redGreenSwap ? '已开启' : '已关闭';
                        alert('💡 灯棒长度: ' + length + ' 段\n⏰ 自动关机: ' + shutdownText + '\n🎨 红绿切换: ' + colorText);
                    } else {
                        alert('保存失败，请重试');
                    }
                }
            };
            xhr.send(JSON.stringify({ 
                light_stick_length: parseInt(length),
                auto_shutdown: autoShutdown,
                auto_shutdown_seconds: autoShutdownSeconds,
                red_green_swap: redGreenSwap
            }));
        }
        
                function checkConnection() {
            var statusEl = document.getElementById('connectionStatus');
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/health', true);
            xhr.timeout = 3000;
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4) {
                    if (xhr.status == 200) {
                        statusEl.className = 'connection-status connected';
                        statusEl.innerHTML = '<span class="status-dot"></span><span>已连接</span>';
                    } else {
                        statusEl.className = 'connection-status disconnected';
                        statusEl.innerHTML = '<span class="status-dot"></span><span>未连接</span>';
                    }
                }
            };
            xhr.ontimeout = function() {
                statusEl.className = 'connection-status disconnected';
                statusEl.innerHTML = '<span class="status-dot"></span><span>连接超时</span>';
            };
            xhr.send();
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            checkConnection();
            setInterval(checkConnection, 5000);
        });
    </script>
</body>
</html>
