<!DOCTYPE html>
<html>
<head>
<title>OpenStickT1图片素材管理器</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
.header h1 { font-size: 1.8em; font-weight: 600; margin-bottom: 10px; }
.path-bar { display: none; }
.connection-status {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    z-index: 1000;
    font-size: 0.9em;
    font-weight: 600;
}
.connection-status.connected { color: #16a34a; }
.connection-status.disconnected { color: #dc2626; }
.connection-status.connecting { color: #f59e0b; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.connection-status.connected .status-dot { background: #16a34a; box-shadow: 0 0 10px #16a34a; }
.connection-status.disconnected .status-dot { background: #dc2626; }
.connection-status.connecting .status-dot { background: #f59e0b; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.content { padding: 20px; }
.file-list { list-style: none; }
.file-item { background: #f8f9fa; margin-bottom: 10px; padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px; transition: all 0.3s; }
.file-item:hover { background: #e9ecef; transform: translateX(5px); }
.dir-item { cursor: pointer; }
.dir-link { display: flex; align-items: center; gap: 15px; width: 100%; text-decoration: none; color: inherit; }
.file-icon { font-size: 2em; width: 50px; text-align: center; }
.file-info { flex: 1; min-width: 0; }
.file-name { font-weight: 600; color: #333; word-break: break-all; font-size: 1.1em; }
.file-preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 2px solid #667eea; }
.file-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 0.9em; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.btn-download { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
.btn-download:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
.btn-delete { background: #ff4757; color: white; }
.btn-delete:hover { background: #ff3344; }
.btn-browse { background: #2ed573; color: white; }
.btn-browse:hover { background: #26b863; }
.btn-back { background: #747d8c; color: white; }
.btn-back:hover { background: #57606f; }
.btn-delete-all { background: #ff4757; color: white; }
.btn-delete-all:hover { background: #ff3344; }
.btn-select-all { background: #00d2d3; color: white; }
.btn-select-all:hover { background: #00b8b8; }
.btn-download-all { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
.btn-download-all:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
.btn-refresh { background: #747d8c; color: white; }
.btn-refresh:hover { background: #57606f; }
.btn-refresh.loading { opacity: 0.7; pointer-events: none; }
.btn-refresh.loading::after { content: " 🔄"; animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.checkbox-wrap { flex-shrink: 0; }
.delete-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #667eea; }
.file-item.selected { background: #e8f4fd; border: 2px solid #667eea; }
.toolbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.toolbar-left { display: flex; align-items: center; gap: 15px; }
.toolbar-right { display: flex; align-items: center; gap: 10px; }
.selected-count { font-size: 0.9em; color: #666; }
.delete-progress-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; }
.delete-progress-box { background: white; border-radius: 16px; padding: 30px; max-width: 400px; width: 90%; text-align: center; }
.delete-progress-icon { font-size: 3em; margin-bottom: 15px; }
.delete-progress-title { font-size: 1.3em; font-weight: 600; color: #333; margin-bottom: 10px; }
.delete-progress-text { color: #666; margin-bottom: 20px; }
.delete-progress-bar { height: 12px; background: #eee; border-radius: 6px; overflow: hidden; margin-bottom: 15px; }
.delete-progress-fill { height: 100%; background: linear-gradient(90deg, #ff4757 0%, #ff6b81 100%); width: 0%; transition: width 0.3s; }

.upload-section { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 900px; width: calc(100% - 40px); background: white; border-radius: 16px 16px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); border-top: 2px solid #667eea; z-index: 1000; }
.upload-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 25px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px 16px 0 0; cursor: pointer; transition: all 0.3s; user-select: none; }
.upload-header:hover { filter: brightness(1.05); }

.upload-header-title { color: white; font-size: 1.2em; font-weight: 600; display: flex; align-items: center; gap: 12px; }
.upload-header-hint { color: rgba(255,255,255,0.85); font-size: 0.9em; opacity: 0.9; }
.upload-header-arrow { color: white; font-size: 1.5em; transition: transform 0.3s; }
.upload-content { display: none; padding: 20px 25px; }
.upload-box { border: 3px dashed #ddd; border-radius: 12px; padding: 25px; text-align: center; transition: all 0.3s; background: #fafafa; cursor: pointer; position: relative; overflow: hidden; }
.upload-box:hover { border-color: #667eea; background: linear-gradient(135deg, #f0f0ff 0%, #fff 100%); }
.upload-box.dragover { border-color: #667eea; background: #f0f0ff; transform: scale(1.02); }
.upload-icon { font-size: 3em; margin-bottom: 10px; opacity: 0.6; }
.upload-label { display: block; color: #667eea; font-weight: 600; font-size: 1em; margin-bottom: 5px; }
.upload-subtext { color: #999; font-size: 0.85em; }
.custom-file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.btn-upload { width: 100%; padding: 12px; font-size: 1em; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-weight: 600; margin-top: 15px; }
.btn-upload:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
.btn-upload:disabled { background: #ccc; cursor: not-allowed; transform: none; }
#progress { display: none; margin-top: 15px; }
.progress-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); width: 0%; transition: width 0.3s; }
.progress-text { text-align: center; margin-top: 8px; font-weight: 600; color: #667eea; font-size: 0.9em; }
.content { padding-bottom: 200px; }
.select-all-wrap { display: flex; align-items: center; gap: 8px; background: #f8f9fa; padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; }
.select-all-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: #667eea; }
.select-all-label { font-weight: 600; color: #333; cursor: pointer; user-select: none; }
.back-home { position: fixed; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; background: white; color: #667eea; border-radius: 20px; text-decoration: none; font-size: 0.95em; font-weight: 600; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 1000; }
.back-home:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3); }
@media (max-width: 600px) {
    body { padding: 10px; }
    .container { border-radius: 15px; }
    .header { padding: 20px; }
    .header h1 { font-size: 1.4em; }
    .content { padding: 15px; }
    .file-item { padding: 10px; flex-direction: row; align-items: center; gap: 10px; }
    .file-icon { font-size: 1.5em; }
    .file-preview-img { width: 50px; height: 50px; }
    .file-info { flex: 1; }
    .file-name { font-size: 1em; }
    .btn { padding: 8px 12px; font-size: 0.85em; }
    .back-home { top: 12px; left: 12px; padding: 8px 12px; font-size: 0.8em; gap: 4px; }
}
</style>
</head>
<body>
<a href="/" class="back-home">⬅️ 返回</a>
<div class="connection-status connecting" id="connectionStatus">
    <span class="status-dot"></span>
    <span>连接检测中...</span>
</div>
<div class="container">
<div class="header">
<h1>🎨 OpenStickT1图片素材管理器</h1>
<div class="path-bar">📍 当前位置：{{PATH_DISPLAY}}</div>
</div>
<div class="toolbar" id="toolbar">
<div class="toolbar-left">
{{BACK_BUTTON}}
</div>
<div class="toolbar-right">
<span class="selected-count" id="selectedCount">已选择 0 个文件</span>
<button class="btn btn-download-all" id="downloadAllBtn">⬇️ 下载选中</button>
<button class="btn btn-delete-all" id="deleteAllBtn">🗑️ 删除选中</button>
</div>
</div>
<div class="content">
<div class="select-all-wrap">
<input type="checkbox" id="selectAllCheckbox" class="select-all-checkbox">
<label for="selectAllCheckbox" class="select-all-label">全选</label>
</div>
<ul class="file-list">
{{FILE_LIST}}
</ul>
</div>
</div>
<div class="delete-progress-overlay" id="deleteOverlay">
<div class="delete-progress-box">
<div class="delete-progress-icon">🗑️</div>
<div class="delete-progress-title" id="deleteTitle">正在删除...</div>
<div class="delete-progress-text" id="deleteText">正在处理，请稍候...</div>
<div class="delete-progress-bar"><div class="delete-progress-fill" id="deleteProgress"></div></div>
</div>
</div>
<div class="upload-section">
<div class="upload-header" id="uploadToggle">
<div class="upload-header-title">
📤 上传文件
<span class="upload-header-hint" id="uploadHint">点击展开上传区域</span>
</div>
<div class="upload-header-arrow" id="uploadArrow">▼</div>
</div>
<div class="upload-content" id="uploadContent">
<div class="upload-box" id="uploadBox">
<form id="uploadForm" action="/upload?path={{CURRENT_PATH}}" method="post" enctype="multipart/form-data">
<span class="upload-icon">📁</span>
<span class="upload-label">点击选择图片或拖拽图片到这里</span>
<span class="upload-subtext">仅支持 .bmp 和 .jpg 格式，可多选</span>
<input type="file" name="file" id="fileInput" class="custom-file-input" multiple required accept=".bmp,.jpg,.jpeg">
</form>
</div>
<div id="selectedFiles" style="display: none; margin-top: 10px; padding: 12px; background: #f0f8ff; border-radius: 10px; border: 2px solid #667eea;">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
<div style="font-weight: 600; color: #667eea;">📋 已选择 <span id="selectedCount">0</span> 个文件</div>
<button type="button" id="clearFiles" style="background: #333; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: all 0.2s;">✕ 清除</button>
</div>
<div id="selectedFilesList" style="font-size: 0.9em; color: #333; max-height: 100px; overflow-y: auto;"></div>
</div>
<button type="submit" form="uploadForm" class="btn-upload" id="uploadBtn">🚀 开始上传</button>
<div id="progress">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<p id="progressText" class="progress-text">0%</p>
</div>
</div>
</div>
<script>
document.getElementById("uploadForm").addEventListener("submit", function(e) {
    var fileInput = document.getElementById("fileInput");
    if (fileInput.files.length === 0) return;
    isOperationInProgress = true;
    var validExtensions = [".bmp", ".jpg", ".jpeg"];
    for (var i = 0; i < fileInput.files.length; i++) {
        var fileName = fileInput.files[i].name.toLowerCase();
        var isValid = validExtensions.some(function(ext) {
            return fileName.endsWith(ext);
        });
        if (!isValid) {
            alert("只允许上传 .bmp 和 .jpg 格式的图片文件！");
            return;
        }
    }
    e.preventDefault();
    var progress = document.getElementById("progress");
    var progressFill = document.getElementById("progressFill");
    var progressText = document.getElementById("progressText");
    var uploadBtn = document.getElementById("uploadBtn");
    progress.style.display = "block";
    uploadBtn.disabled = true;
    uploadBtn.textContent = "上传中...";
    var xhr = new XMLHttpRequest();
    var form = new FormData(this);
    xhr.upload.addEventListener("progress", function(e) {
        if (e.lengthComputable) {
            var percent = (e.loaded / e.total) * 100;
            progressFill.style.width = percent + "%";
            progressText.textContent = Math.round(percent) + "%";
        }
    });
    xhr.addEventListener("load", function() {
        progressFill.style.width = "100%";
        progressText.textContent = "✅ 上传完成！";
        isOperationInProgress = false;
        setTimeout(function() {
            progress.style.display = "none";
            uploadBtn.disabled = false;
            uploadBtn.textContent = "🚀 开始上传";
            fileInput.value = "";
            selectedFiles.style.display = "none";
            selectedFilesList.innerHTML = "";
            document.getElementById("selectedCount").textContent = "0";
            if (typeof refreshFileList === "function") {
                refreshFileList();
            } else {
                location.reload();
            }
        }, 800);
    });
    xhr.addEventListener("error", function() {
        alert("上传失败，请重试！");
        progress.style.display = "none";
        uploadBtn.disabled = false;
        uploadBtn.textContent = "🚀 开始上传";
        isOperationInProgress = false;
    });
    xhr.open("POST", "/upload?path={{CURRENT_PATH}}");
    xhr.send(form);
});
document.addEventListener("DOMContentLoaded", function() {
    var uploadToggle = document.getElementById("uploadToggle");
    var uploadContent = document.getElementById("uploadContent");
    var uploadHint = document.getElementById("uploadHint");
    var uploadArrow = document.getElementById("uploadArrow");
    var uploadBox = document.getElementById("uploadBox");
    var fileInput = document.getElementById("fileInput");
    var selectedFiles = document.getElementById("selectedFiles");
    var selectedFilesList = document.getElementById("selectedFilesList");
    uploadToggle.addEventListener("click", function() {
        var isExpanded = uploadContent.style.display === "block";
        if (isExpanded) {
            uploadContent.style.display = "none";
            uploadToggle.classList.remove("expanded");
            uploadHint.textContent = "点击展开上传区域";
            uploadArrow.textContent = "▼";
        } else {
            uploadContent.style.display = "block";
            uploadToggle.classList.add("expanded");
            uploadHint.textContent = "点击收起上传区域";
            uploadArrow.textContent = "▲";
        }
    });
    var selectedCount = document.getElementById("selectedCount");
    var clearFiles = document.getElementById("clearFiles");
    fileInput.addEventListener("change", function() {
        if (this.files.length > 0) {
            var fileNames = [];
            for (var i = 0; i < this.files.length; i++) {
                fileNames.push(this.files[i].name);
            }
            selectedFilesList.innerHTML = fileNames.join("<br>");
            selectedCount.textContent = this.files.length;
            selectedFiles.style.display = "block";
        } else {
            selectedFiles.style.display = "none";
        }
    });
    clearFiles.addEventListener("click", function() {
        fileInput.value = "";
        selectedFilesList.innerHTML = "";
        selectedCount.textContent = "0";
        selectedFiles.style.display = "none";
    });
    uploadBox.addEventListener("dragover", function(e) {
        e.preventDefault();
        uploadBox.classList.add("dragover");
    });
    uploadBox.addEventListener("dragleave", function(e) {
        e.preventDefault();
        uploadBox.classList.remove("dragover");
    });
    uploadBox.addEventListener("drop", function(e) {
        e.preventDefault();
        uploadBox.classList.remove("dragover");
        if (e.dataTransfer && e.dataTransfer.files.length > 0) {
            var validExtensions = [".bmp", ".jpg", ".jpeg"];
            var validFiles = [];
            var invalidCount = 0;
            for (var i = 0; i < e.dataTransfer.files.length; i++) {
                var fileName = e.dataTransfer.files[i].name.toLowerCase();
                var isValid = validExtensions.some(function(ext) {
                    return fileName.endsWith(ext);
                });
                if (isValid) {
                    validFiles.push(e.dataTransfer.files[i]);
                } else {
                    invalidCount++;
                }
            }
            if (invalidCount > 0) {
                alert("有 " + invalidCount + " 个文件格式不支持，已自动过滤。仅支持 .bmp 和 .jpg 格式。");
            }
            if (validFiles.length > 0) {
                fileInput.files = validFiles;
                var fileNames = [];
                for (var i = 0; i < validFiles.length; i++) {
                    fileNames.push(validFiles[i].name);
                }
                selectedFilesList.innerHTML = fileNames.join("<br>");
                selectedFiles.style.display = "block";
            }
        }
    });
    var selectAllBtn = document.getElementById("selectAllBtn");
    var downloadAllBtn = document.getElementById("downloadAllBtn");
    var deleteAllBtn = document.getElementById("deleteAllBtn");
    var selectedCountEl = document.getElementById("selectedCount");
    var deleteOverlay = document.getElementById("deleteOverlay");
    var deleteProgress = document.getElementById("deleteProgress");
    var deleteTitle = document.getElementById("deleteTitle");
    var deleteText = document.getElementById("deleteText");
    var checkboxes = document.querySelectorAll(".delete-checkbox");
    var selectAllCheckbox = document.getElementById("selectAllCheckbox");
    function updateSelection() {
        var checkedBoxes = document.querySelectorAll(".delete-checkbox:checked");
        var count = checkedBoxes.length;
        selectedCountEl.textContent = "已选择 " + count + " 个文件";
        var hasFiles = false;
        checkedBoxes.forEach(function(cb) {
            if (cb.getAttribute("data-type") === "file") {
                hasFiles = true;
            }
        });

        var allCheckboxes = document.querySelectorAll(".delete-checkbox");
        if (count === allCheckboxes.length && allCheckboxes.length > 0) {
            selectAllCheckbox.checked = true;
        } else {
            selectAllCheckbox.checked = false;
        }
        document.querySelectorAll(".file-item").forEach(function(item) {
            var cb = item.querySelector(".delete-checkbox");
            item.classList.toggle("selected", cb && cb.checked);
        });
    }
    checkboxes.forEach(function(cb) {
        cb.addEventListener("change", updateSelection);
    });
    if (selectAllCheckbox) {
        selectAllCheckbox.addEventListener("change", function() {
            var allCheckboxes = document.querySelectorAll(".delete-checkbox");
            allCheckboxes.forEach(function(cb) {
                cb.checked = selectAllCheckbox.checked;
            });
            updateSelection();
        });
    }
    downloadAllBtn.addEventListener("click", function() {
        isOperationInProgress = true;
        var checkedBoxes = document.querySelectorAll(".delete-checkbox:checked");
        var filesToDownload = [];
        checkedBoxes.forEach(function(cb) {
            if (cb.getAttribute("data-type") === "file") {
                filesToDownload.push({ path: cb.value, name: cb.value.split("/").pop() });
            }
        });
        if (filesToDownload.length === 0) {
            alert("请先选择要下载的文件");
            return;
        }
        var downloadNext = function(index) {
            if (index >= filesToDownload.length) {
                isOperationInProgress = false;
                checkConnection();
                return;
            }
            var file = filesToDownload[index];
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/download?file=" + encodeURIComponent(file.path));
            xhr.responseType = "blob";
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    var url = window.URL.createObjectURL(blob);
                    var a = document.createElement("a");
                    a.href = url;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }
                downloadNext(index + 1);
            };
            xhr.onerror = function() {
                downloadNext(index + 1);
                isOperationInProgress = false;
            };
            xhr.send();
        };
        downloadNext(0);
    });
    document.querySelectorAll(".file-item").forEach(function(item) {
        item.addEventListener("click", function(e) {
            if (e.target.classList.contains("delete-checkbox")) return;
            var checkbox = this.querySelector(".delete-checkbox");
            if (checkbox) {
                checkbox.checked = !checkbox.checked;
                updateSelection();
            }
        });
    });
    deleteAllBtn.addEventListener("click", function() {
        isOperationInProgress = true;
        var checkedBoxes = document.querySelectorAll(".delete-checkbox:checked");
        if (checkedBoxes.length === 0) {
            alert("请先选择要删除的项目");
            return;
        }
        var filesToDelete = [];
        checkedBoxes.forEach(function(cb) {
            filesToDelete.push({ path: cb.value, type: cb.getAttribute("data-type"), name: cb.value.split("/").pop() });
        });
        var message = "确定要删除选中的 " + filesToDelete.length + " 个项目吗？\n\n";
        filesToDelete.forEach(function(f, i) {
            message += (i + 1) + ". " + (f.type === "dir" ? "📁 " : "📄 ") + f.name + "\n";
        });
        if (!confirm(message)) return;
        deleteOverlay.style.display = "flex";
        deleteProgress.style.width = "0%";
        deleteTitle.textContent = "正在删除...";
        deleteText.textContent = "准备删除 " + filesToDelete.length + " 个项目";
        
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/delete");
        xhr.setRequestHeader("Content-Type", "application/json");
        
        var filePaths = filesToDelete.map(function(f) { return { path: f.path }; });
        
        xhr.upload.addEventListener("progress", function(e) {
            if (e.lengthComputable) {
                var percent = Math.round((e.loaded / e.total) * 100);
                deleteProgress.style.width = percent + "%";
            }
        });
        
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var result = JSON.parse(xhr.responseText);
                    deleteTitle.textContent = "删除完成！";
                    deleteText.textContent = "已成功删除 " + result.deleted + " 个项目";
                    deleteProgress.style.width = "100%";
                    if (result.errors && result.errors.length > 0) {
                        console.log("部分文件删除失败:", result.errors);
                    }
                } catch (e) {
                    deleteTitle.textContent = "删除完成！";
                    deleteText.textContent = "已删除 " + filesToDelete.length + " 个项目";
                    deleteProgress.style.width = "100%";
                }
            } else {
                deleteTitle.textContent = "删除失败";
                deleteText.textContent = "服务器返回错误 " + xhr.status;
            }
            setTimeout(function() {
                deleteOverlay.style.display = "none";
                isOperationInProgress = false;
                if (typeof refreshFileList === "function") {
                    refreshFileList();
                } else {
                    location.reload();
                }
            }, 1000);
        };
        
        xhr.onerror = function() {
            deleteTitle.textContent = "删除失败";
            deleteText.textContent = "网络错误，请重试";
            setTimeout(function() {
                deleteOverlay.style.display = "none";
                isOperationInProgress = false;
            }, 2000);
        };
        
        xhr.send(JSON.stringify({ files: filePaths }));
    });
    var currentPath = "{{CURRENT_PATH}}";
    var connectionCheckInterval;
    var isOperationInProgress = false;
    
    function checkConnection() {
        if (isOperationInProgress) {
            return;
        }
        var statusEl = document.getElementById('connectionStatus');
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/health?' + Date.now(), true);
        xhr.timeout = 3000;
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4) {
                if (xhr.status == 200) {
                    statusEl.className = 'connection-status connected';
                    statusEl.innerHTML = '<span class="status-dot"></span><span>已连接</span>';
                } else {
                    statusEl.className = 'connection-status disconnected';
                    statusEl.innerHTML = '<span class="status-dot"></span><span>未连接</span>';
                }
            }
        };
        xhr.ontimeout = function() {
            statusEl.className = 'connection-status disconnected';
            statusEl.innerHTML = '<span class="status-dot"></span><span>连接超时</span>';
        };
        xhr.send();
    }
    
    function startConnectionCheck() {
        if (connectionCheckInterval) {
            clearInterval(connectionCheckInterval);
        }
        checkConnection();
        connectionCheckInterval = setInterval(checkConnection, 5000);
    }
    
    function stopConnectionCheck() {
        if (connectionCheckInterval) {
            clearInterval(connectionCheckInterval);
            connectionCheckInterval = null;
        }
    }
    
    startConnectionCheck();
    
    function refreshFileList() {
        var refreshBtn = document.getElementById("refreshBtn");
        if (refreshBtn) refreshBtn.classList.add("loading");
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/api/list?dir=" + encodeURIComponent(currentPath), true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    updateFileList(data.files);
                } catch (e) {
                    console.error("解析文件列表失败:", e);
                    location.reload();
                }
            }
            if (refreshBtn) refreshBtn.classList.remove("loading");
        };
        xhr.onerror = function() {
            if (refreshBtn) refreshBtn.classList.remove("loading");
            location.reload();
        };
        xhr.send();
    }
    function updateFileList(files) {
        var fileList = document.querySelector(".file-list");
        if (!fileList) return;
        fileList.innerHTML = "";
        files.forEach(function(file) {
            var is_image = false;
            if (file.type === "file") {
                var ext = file.name.toLowerCase().split(".").pop();
                is_image = ["bmp", "jpg", "jpeg"].indexOf(ext) !== -1;
            }
            if (file.type === "dir") {
                var itemHtml = '<li class="file-item dir-item" data-path="' + file.path + '"><label class="checkbox-wrap"><input type="checkbox" class="delete-checkbox" value="' + file.path + '" data-type="dir"></label><a href="/browse?dir=' + encodeURIComponent(file.path) + '" class="dir-link"><div class="file-icon">📁</div><div class="file-info"><div class="file-name">' + file.name + '</div></div></a></li>';
            } else if (is_image) {
                var iconHtml = '<img src="/download?file=' + encodeURIComponent(file.path).replace(/"/g, "%22") + '" class="file-preview-img" alt="' + file.name + '">';
                var itemHtml = '<li class="file-item image-item" data-path="' + file.path + '"><label class="checkbox-wrap"><input type="checkbox" class="delete-checkbox" value="' + file.path + '" data-type="file"></label>' + iconHtml + '<div class="file-info"><div class="file-name">' + file.name + '</div></div></li>';
            } else {
                var itemHtml = '<li class="file-item" data-path="' + file.path + '"><label class="checkbox-wrap"><input type="checkbox" class="delete-checkbox" value="' + file.path + '" data-type="file"></label><div class="file-icon">📄</div><div class="file-info"><div class="file-name">' + file.name + '</div></div></li>';
            }
            fileList.innerHTML += itemHtml;
        });
        checkboxes = document.querySelectorAll(".delete-checkbox");
        checkboxes.forEach(function(cb) {
            cb.addEventListener("change", updateSelection);
        });
        var fileItems = document.querySelectorAll(".file-item");
        fileItems.forEach(function(item) {
            item.addEventListener("click", function(e) {
                if (e.target.classList.contains("delete-checkbox")) return;
                var checkbox = this.querySelector(".delete-checkbox");
                if (checkbox) {
                    checkbox.checked = !checkbox.checked;
                    updateSelection();
                }
            });
        });
        updateSelection();
    }
    document.getElementById("refreshBtn").addEventListener("click", refreshFileList);
});
</script>
</body>
</html>
