<!DOCTYPE html>
<html>
<head>
<title>OpenStickT1 - 设备管理</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { text-align: center; }
.logo { width: 300px; height: auto; margin-bottom: 30px; }
@keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
.title { font-size: 2.5em; color: white; font-weight: 700; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
.subtitle { font-size: 1.2em; color: rgba(255,255,255,0.9); margin-bottom: 50px; }
.buttons { display: flex; gap: 25px; justify-content: center; flex-wrap: wrap; }
.btn { padding: 20px 50px; font-size: 1.3em; font-weight: 600; border: none; border-radius: 16px; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 12px; min-width: 200px; justify-content: center; }
.btn-create { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%); color: white; box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4); }
.btn-create:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(255, 107, 107, 0.5); }
.btn-manage { background: white; color: #667eea; box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
.btn-manage:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(102, 126, 234, 0.3); }
.btn-icon { font-size: 1.5em; }
.footer { position: fixed; bottom: 30px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.7); font-size: 0.9em; }
.connection-status {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    z-index: 1000;
    font-size: 0.9em;
    font-weight: 600;
}
.connection-status.connected { color: #16a34a; }
.connection-status.disconnected { color: #dc2626; }
.connection-status.connecting { color: #f59e0b; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.connection-status.connected .status-dot { background: #16a34a; box-shadow: 0 0 10px #16a34a; }
.connection-status.disconnected .status-dot { background: #dc2626; }
.connection-status.connecting .status-dot { background: #f59e0b; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (max-width: 600px) {
    .title { font-size: 1.8em; }
    .subtitle { font-size: 1em; }
    .buttons { flex-direction: column; align-items: center; }
    .btn { padding: 18px 40px; font-size: 1.2em; min-width: 250px; }
    .logo { font-size: 4em; }
}
</style>
</head>
<body>
<div class="connection-status connecting" id="connectionStatus">
    <span class="status-dot"></span>
    <span>连接检测中...</span>
</div>
<div class="container">
<img src="/download?file=/sd/apps/WifiSend/www/logo.png" class="logo" alt="OpenStickT1 Logo">
<h1 class="title">OpenStickT1</h1>
<p class="subtitle">设备管理器</p>
<div class="buttons">
<a href="/settings" class="btn btn-create">
<span class="btn-icon">⚙️</span>
<span>参数设置</span>
</a>
<a href="/manager" class="btn btn-manage">
<span class="btn-icon">📁</span>
<span>素材管理</span>
</a>
</div>
</div>
<div class="footer">OpenStickT1 Control</div>
<script>
function checkConnection() {
    var statusEl = document.getElementById('connectionStatus');
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/health', true);
    xhr.timeout = 3000;
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4) {
            if (xhr.status == 200) {
                statusEl.className = 'connection-status connected';
                statusEl.innerHTML = '<span class="status-dot"></span><span>已连接</span>';
            } else {
                statusEl.className = 'connection-status disconnected';
                statusEl.innerHTML = '<span class="status-dot"></span><span>未连接</span>';
            }
        }
    };
    xhr.ontimeout = function() {
        statusEl.className = 'connection-status disconnected';
        statusEl.innerHTML = '<span class="status-dot"></span><span>连接超时</span>';
    };
    xhr.send();
}
checkConnection();
setInterval(checkConnection, 5000);
</script>
</body>
</html>
